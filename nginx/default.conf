# Static site behind nginx-proxy-manager and Cloudflare.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects like /about -> /about/ stay relative, so they work behind the proxy (https).
    absolute_redirect off;

    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    error_page 404 /404.html;

    # Legacy URLs still known to Google: /index, /index.html, /ru/index.html ... -> canonical folder URL.
    # Checked on $request_uri, so the internal `index index.html` lookup does not loop.
    if ($request_uri ~ "^(/(?:[a-z]+/)*)index(?:\.html)?(?:\?|$)") {
        return 301 $1;
    }

    # The games used to live on the main site; they moved to their own subdomains.
    location ~* ^/caferacer(/|$) {
        return 301 https://caferacer.rufus.pro/;
    }
    location ~* ^/magicball(/|$) {
        return 301 https://magicball.rufus.pro/;
    }

    # Hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(images|fonts)/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /404.html {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }

    # Pages (/, /about/, /ru/, /fi/about/ ...), robots.txt, sitemap.xml, llms.txt.
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
